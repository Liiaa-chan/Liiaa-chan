<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" xml:space="preserve" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text{font-family:'JetBrains Mono','Fira Code','DejaVu Sans Mono',Menlo,Consolas,monospace;font-size:15px;white-space:pre}
    .p{fill:#cba6f7}.c{fill:#cdd6f4}.k{fill:#f5c2e7}.v{fill:#bac2de}.d{fill:#6c7086}.b{fill:#89b4fa}.g{fill:#a6e3a1}.o{fill:#fab387}
    .sm{font-size:12px}
    .s{opacity:0;animation:on .01s forwards}
    @keyframes on{to{opacity:1}}
    @keyframes off{to{opacity:0}}
    .t{width:0;animation-name:type;animation-fill-mode:forwards}
    @keyframes type{to{width:var(--w)}}}
    .cur{fill:#a259ff !important;animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    @keyframes mv{to{transform:translateX(var(--d))}}
    .win{animation:winh 15.2s ease-out forwards}
    @keyframes winh{
      0%,10.53%{height:130px}
      12.5%,20.39%{height:215px}
      22.37%,39.47%{height:250px}
      41.45%,50.66%{height:440px}
      52.63%,68.42%{height:480px}
      70.39%,72.37%{height:515px}
      74.34%,90.79%{height:565px}
      93.42%,98.03%{height:690px}
      100%{height:720px}
    }
    .steam{animation:rise 2s ease-in-out infinite}
    @keyframes rise{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
  </style>

  <defs>
    <clipPath id="cA"><rect class="t" x="60" y="44" height="26" style="--w:56px;animation-delay:1s;animation-duration:.6s;animation-timing-function:steps(6)"/></clipPath>
    <clipPath id="cB"><rect class="t" x="60" y="212" height="26" style="--w:136px;animation-delay:5s;animation-duration:1s;animation-timing-function:steps(15)"/></clipPath>
    <clipPath id="cC"><rect class="t" x="60" y="442" height="26" style="--w:146px;animation-delay:9.5s;animation-duration:.9s;animation-timing-function:steps(16)"/></clipPath>
    <clipPath id="cH"><rect class="t" x="105" y="506" height="24" style="--w:180px;animation-delay:11.5s;animation-duration:2s;animation-timing-function:steps(20)"/></clipPath>
  </defs>

  <!-- jendela -->
  <rect class="win" width="800" height="130" rx="10" fill="#1e1e2e"/>
  <rect width="800" height="34" rx="10" fill="#181825"/>
  <rect y="20" width="800" height="14" fill="#181825"/>
  <circle cx="20" cy="17" r="6" fill="#f38ba8"/><circle cx="42" cy="17" r="6" fill="#f9e2af"/><circle cx="64" cy="17" r="6" fill="#a6e3a1"/>
  <text x="400" y="22" text-anchor="middle" class="d sm">guest@nexora: ~</text>

  <!-- ===== PERINTAH 1: whoami (y 64 - 194) ===== -->
  <text x="24" y="64" class="p">~ $</text>
  <text x="60" y="64" class="c" clip-path="url(#cA)">whoami</text>
  <g style="animation:off .01s 1.7s forwards">
    <rect class="cur" x="60" y="51" width="9" height="16" style="--d:54px;animation:blink 1s steps(1) infinite,mv .6s steps(6) 1s forwards"/>
  </g>
  <rect class="s" x="24" y="80" width="3" height="118" rx="1.5" fill="#cba6f7" style="animation-delay:1.9s"/>
  <text class="s c" x="42" y="102" style="font-size:24px;font-weight:700;animation-delay:1.9s">Dian Wicaksono</text>
  <text class="s k" x="42" y="128" style="animation-delay:2.15s">Full Stack Web Developer &amp; IoT Enthusiast</text>
  <text class="s v" x="42" y="150" style="animation-delay:2.4s">Malang, Indonesia<tspan class="d"> · UTC+7</tspan></text>
  <text class="s d" x="42" y="172" style="animation-delay:2.65s">"Get Everything you want."</text>
  <text class="s" x="42" y="194" style="animation-delay:2.9s"><tspan class="g">●</tspan><tspan class="v"> available for new projects</tspan></text>

  <!-- ===== PERINTAH 2: sudo list stack (y 232 - 428) ===== -->
  <g class="s" style="animation-delay:3.4s">
    <text x="24" y="232" class="p">~ $</text>
    <g style="animation:off .01s 6.1s forwards">
      <rect class="cur" x="60" y="219" width="9" height="16" style="--d:135px;animation:blink 1s steps(1) infinite,mv 1s steps(15) 5s forwards"/>
    </g>
  </g>
  <text x="60" y="232" class="c" clip-path="url(#cB)">sudo list stack</text>

  <g class="s" style="animation-delay:6.3s">
    <rect x="24" y="248" width="752" height="180" rx="6" fill="none" stroke="#313244"/>
    <rect x="24.5" y="248.5" width="751" height="29" rx="5.5" fill="#181825"/>
    <text x="40" y="268" class="d sm">category</text>
    <text x="190" y="268" class="d sm">stack</text>
    <text x="520" y="268" class="d sm">status</text>
  </g>

  <g class="s" style="animation-delay:6.55s">
    <text x="40" y="298" class="k">Language</text><text x="190" y="298" class="v">Python · C/C++ · JavaScript · PHP</text>
    <text x="520" y="298"><tspan class="g">●</tspan><tspan class="v"> daily use</tspan></text>
  </g>
  <line class="s" x1="24" y1="308" x2="776" y2="308" stroke="#313244" style="animation-delay:6.55s"/>

  <g class="s" style="animation-delay:6.77s">
    <text x="40" y="328" class="k">Frontend</text><text x="190" y="328" class="v">React · Tailwindcss · Blade</text>
    <text x="520" y="328"><tspan class="g">●</tspan><tspan class="v"> daily use</tspan></text>
  </g>
  <line class="s" x1="24" y1="338" x2="776" y2="338" stroke="#313244" style="animation-delay:6.77s"/>

  <g class="s" style="animation-delay:6.99s">
    <text x="40" y="358" class="k">Backend</text><text x="190" y="358" class="v">Node.js · Laravel · Python</text>
    <text x="520" y="358"><tspan class="b">●</tspan><tspan class="v"> daily use</tspan></text>
  </g>
  <line class="s" x1="24" y1="368" x2="776" y2="368" stroke="#313244" style="animation-delay:6.99s"/>

  <g class="s" style="animation-delay:7.21s">
    <text x="40" y="388" class="k">Database</text><text x="190" y="388" class="v">MySQL · InfluxDB</text>
    <text x="520" y="388"><tspan class="o">●</tspan><tspan class="v"> daily use &amp; learning</tspan></text>
  </g>
  <line class="s" x1="24" y1="398" x2="776" y2="398" stroke="#313244" style="animation-delay:7.21s"/>

  <g class="s" style="animation-delay:7.43s">
    <text x="40" y="418" class="k">Tools</text><text x="190" y="418" class="v">Linux · Neovim · Docker · Git</text>
    <text x="520" y="418"><tspan class="g">●</tspan><tspan class="v"> daily use</tspan></text>
  </g>

  <!-- ===== PERINTAH 3: sudo make coffee (y 462 - 670) ===== -->
  <g class="s" style="animation-delay:8s">
    <text x="24" y="462" class="p">~ $</text>
    <g style="animation:off .01s 10.5s forwards">
      <rect class="cur" x="60" y="449" width="9" height="16" style="--d:144px;animation:blink 1s steps(1) infinite,mv .9s steps(16) 9.5s forwards"/>
    </g>
  </g>
  <text x="60" y="462" class="c" clip-path="url(#cC)">sudo make coffee</text>

  <text class="s d" x="24" y="494" style="animation-delay:10.7s">[sudo] password for guest: ********</text>

  <g class="s" style="animation-delay:11.3s">
    <text x="24" y="522" class="v">brewing <tspan class="d">[                    ]</tspan></text>
    <text x="24" y="522" class="p" clip-path="url(#cH)"><tspan fill="none">brewing [</tspan>####################</text>
  </g>

  <text class="s" x="24" y="550" style="animation-delay:13.7s"><tspan class="g">[ ok ]</tspan><tspan class="v"> coffee ready. commits unlocked.</tspan></text>

  <g class="s" style="animation-delay:14.3s">
    <text class="steam d" x="40" y="578">  ( (</text>
    <text class="steam d" x="40" y="596" style="animation-delay:1s">   ) )</text>
    <text class="k" x="40" y="614"> ........</text>
    <text class="k" x="40" y="632"> |      |]</text>
    <text class="k" x="40" y="650"> \      /</text>
    <text class="k" x="40" y="668">  `----'</text>
  </g>
  <g class="s" style="animation-delay:14.6s">
    <text class="d" x="200" y="632"># no python was harmed</text>
    <text class="d" x="200" y="650"># refresh to replay</text>
  </g>

  <g class="s" style="animation-delay:15.2s">
    <text x="24" y="702" class="p">~ $</text>
    <rect class="cur" x="60" y="689" width="9" height="16"/>
  </g>
</svg>